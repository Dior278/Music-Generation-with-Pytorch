# Configuration par défaut pour le générateur de musique AI

paths:
  model: "best_model.pth"
  vocab: "vocab.json"
  output: "outputs"

# Architecture LSTM (alignée avec notebooks/train_lstm_*.ipynb)
model:
  embedding_dim: 128
  hidden_dim: 256
  num_layers: 2
  dropout: 0.3

training:
  epochs: 10
  batch_size: 256
  learning_rate: 0.001
  seq_length: 64
  # 30% ≈ bon compromis qualité / durée CPU (~quelques heures)
  dataset_fraction: 0.3
  train_split: 0.95
  gradient_clip: 1.0
  early_stopping_patience: 3
  scheduler_patience: 2
  scheduler_factor: 0.5

generation:
  default_temperature: 0.8
  min_temperature: 0.3
  max_temperature: 1.5
  default_length: 400
  min_length: 100
  max_length: 800
  default_key: "C"
  default_meter: "4/4"
  available_keys:
    - "C"
    - "D"
    - "E"
    - "F"
    - "G"
    - "A"
    - "B"
    - "Cm"
    - "Dm"
    - "Em"
    - "Fm"
    - "Gm"
    - "Am"
    - "Bm"
  available_meters:
    - "2/4"
    - "3/4"
    - "4/4"
    - "6/8"

# MusicGen pretrained (no local training)
audio:
  model_id: "facebook/musicgen-small"
  default_duration: 8
  min_duration: 5
  max_duration: 15
  device: "auto"

interface:
  server_name: "0.0.0.0"
  server_port: 7860
  share: false

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "music_generator.log"
  console: true
